[package]
name = "isohypse"
version = "0.1.0"
edition = "2024"
description = "Agent-first, session-based code substrate: verified tag-anchored reads and edits with a live caller and blast-radius index over a warm in-memory daemon."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/redacktion/isohypse"
keywords = ["agent", "code-intelligence", "refactoring", "tree-sitter", "llm"]
categories = ["development-tools"]
rust-version = "1.88"
exclude = ["vendor/"]

[features]
default = []
strict-signature = []

[dependencies]
diffy = "0.4"
libc = "0.2"
model2vec-rs = "0.2.1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.29", features = ["crossterm"] }
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
stack-graphs = { path = "vendor/isohypse-sg", version = "0.14.1", package = "isohypse-sg" }
tree-sitter-stack-graphs = { path = "vendor/isohypse-ts-sg", version = "0.10.0", package = "isohypse-ts-sg" }
tree-sitter-stack-graphs-python = { path = "vendor/isohypse-sg-py", version = "0.3.0", package = "isohypse-sg-py" }
tree-sitter-stack-graphs-javascript = { path = "vendor/isohypse-sg-js", version = "0.3.0", package = "isohypse-sg-js" }
tree-sitter-stack-graphs-typescript = { path = "vendor/isohypse-sg-ts", version = "0.4.0", package = "isohypse-sg-ts" }
tree-sitter-stack-graphs-java = { path = "vendor/isohypse-sg-java", version = "0.5.0", package = "isohypse-sg-java" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
flate2 = "1.1.9"
blake3 = "1"
getrandom = "0.2"
chacha20poly1305 = "0.10"
isohypse-se = { path = "vendor/isohypse-se", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"

[[bin]]
name = "isohypse"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
